name: Kontrollera lagändringar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-law-data.yml'
      - 'scripts/import_laws.py'
      - 'data/catalog.json'
  schedule:
    - cron: '35 4 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sfs-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parser tests
        run: python -m unittest discover -s tests -v
      - name: Fetch statutes
        env:
          CHANGE_REPORT: ${{ runner.temp }}/changes.md
        run: python scripts/import_laws.py
      - name: Check editorial headings against new text
        # Fel här ska synas i granskningen men inte hindra att förslaget skapas.
        continue-on-error: true
        run: |
          if ! node tests/test_editorial.js > editorial.log 2>&1; then
            printf '\n\n**Redaktionella rubriker behöver ses över:**\n\n```\n%s\n```\n' "$(tail -5 editorial.log)" >> "${{ runner.temp }}/changes.md"
          fi
      - name: Bootstrap initial corpus
        if: github.event_name == 'push'
        run: |
          if git ls-files "data/laws/*.json" | grep -q .; then
            echo "Data already in repository; changes require pull-request review."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/laws
          git commit -m "data: initial validated SFS import"
          git push origin HEAD:main
      - name: Build search index and reference register
        run: node scripts/build_indexes.js
      - name: Propose changes for legal review
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sfs-updates
          title: 'Granska importerade och ändrade SFS-författningar'
          commit-message: 'data: import SFS from Riksdagen'
          body-path: ${{ runner.temp }}/changes.md
          add-paths: |
            data/catalog.json
            data/laws/*.json
            data/index/**
      - name: Fail if some statutes could not be imported
        run: |
          if grep -q "Kunde inte importeras" "${{ runner.temp }}/changes.md"; then
            cat "${{ runner.temp }}/changes.md"; exit 1
          fi
