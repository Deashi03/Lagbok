<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F0">
  <meta name="description" content="En snabb svensk lagbok för iPhone. Lagar, förordningar och polisens föreskrifter.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lagboken">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="assets/app.css">
  <title>Lagboken</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button type="button" class="icon-button" id="back" aria-label="Tillbaka" hidden>‹</button>
      <div class="top-title" id="top-title">Lagboken</div>
      <div class="top-actions">
        <button type="button" class="icon-button" id="in-law-search" aria-label="Gå till lagrum eller sök">⌕</button>
        <button type="button" class="icon-button" id="toc-button" aria-label="Innehållsförteckning" hidden>☷</button>
        <button type="button" class="icon-button" id="menu-button" aria-label="Mer" aria-expanded="false">•••</button>
      </div>
    </header>
    <main id="view" tabindex="-1" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Huvudmeny">
      <button type="button" data-tab="catalog"><span class="nav-icon">▤</span><span>Lagbok & sök</span></button>
      <button type="button" data-tab="saved"><span class="nav-icon">☆</span><span>Sparat</span></button>
    </nav>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Snabbmeny" hidden></aside>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="assets/search-core.js" defer></script>
  <script src="assets/legal-links.js" defer></script>
  <script src="assets/editorial.js" defer></script>
  <script src="assets/law-model.js" defer></script>
  <script src="assets/search-index.js" defer></script>
  <script src="assets/highlights.js" defer></script>
  <script src="assets/toc-model.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
